<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Chat</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#304568,#101827 70%);color:#eef3fa;display:grid;place-items:center;padding:16px}.app{width:min(100%,760px);height:min(850px,calc(100dvh - 32px));min-height:460px;display:flex;flex-direction:column;background:#182438;border:1px solid #405171;border-radius:18px;box-shadow:0 20px 60px #070c19aa;overflow:hidden}header{padding:18px 22px;border-bottom:1px solid #33435e;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:1.3rem;margin:0}#status{font-size:.82rem;color:#f7be6a}#status.connected{color:#80d7a4}#chat-window{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.message{max-width:88%;align-self:flex-start;background:#25354f;border:1px solid #354867;border-radius:12px;padding:10px 13px;overflow-wrap:anywhere}.message.mine{align-self:flex-end;background:#244d55;border-color:#397b7e}.message.system{align-self:center;background:transparent;border:0;color:#a7b5cb;font-size:.85rem;text-align:center}.meta{display:flex;gap:10px;align-items:baseline;margin-bottom:4px;font-size:.8rem}.username{font-weight:700;color:#f8c875}time{color:#aab9cf;font-size:.72rem}.message img{display:block;max-width:100%;max-height:320px;border-radius:8px;margin-top:7px}.composer{padding:14px;border-top:1px solid #33435e;position:relative}#preview{display:none;align-items:center;gap:9px;margin-bottom:10px;font-size:.85rem}#preview.visible{display:flex}#preview img{width:52px;height:52px;object-fit:cover;border-radius:7px}.controls{display:flex;gap:8px;align-items:center}button,label.attach{border:1px solid #526582;border-radius:9px;background:#2b3c58;color:#edf2fa;padding:10px 12px;cursor:pointer;font:inherit}button:hover,label.attach:hover{background:#3c5275}button:disabled{opacity:.45;cursor:not-allowed}#message-input{flex:1;min-width:0;padding:11px 12px;border-radius:9px;border:1px solid #526582;background:#111c2e;color:inherit;font:inherit}#message-input:focus{outline:2px solid #6ebbd0}#send-button{background:#1d8b78;border-color:#1d8b78;font-weight:700}#image-input{display:none}#emoji-picker{display:none;position:absolute;bottom:72px;left:14px;width:min(310px,calc(100vw - 55px));max-height:220px;overflow-y:auto;background:#263650;border:1px solid #607394;border-radius:12px;padding:10px;box-shadow:0 10px 28px #0008;grid-template-columns:repeat(7,1fr);gap:2px}#emoji-picker.open{display:grid}#emoji-picker button{padding:5px 2px;border:0;background:transparent;font-size:1.4rem}#error{min-height:20px;color:#ffb2aa;font-size:.8rem;margin:5px 2px 0}@media(max-width:480px){body{padding:0}.app{height:100dvh;min-height:0;border-radius:0}header{padding:14px}#chat-window{padding:12px}.composer{padding:10px}}
</style></head><body><main class="app"><header><h1>🌍 Global Chat</h1><span id="status" role="status">Connecting…</span></header><div id="chat-window" role="log" aria-live="polite" aria-label="Messages"></div><div class="composer"><div id="preview"><img id="preview-image" alt="Selected image preview"><span id="preview-name"></span><button id="remove-image" type="button" aria-label="Remove image">×</button></div><div id="emoji-picker" aria-label="Choose an emoji"></div><form id="message-form" class="controls"><button id="emoji-button" type="button" aria-label="Choose emoji" aria-expanded="false">😊</button><label class="attach" for="image-input" title="Attach image">📎</label><input id="image-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp"><input id="message-input" type="text" maxlength="2000" placeholder="Write a message…" autocomplete="off" aria-label="Message" disabled><button id="send-button" type="submit" disabled>Send</button></form><div id="error" role="alert"></div></div></main>
<script>
// For GitHub Pages, add ?server=wss://your-chat-server.example to the URL.
const configuredServer=new URLSearchParams(location.search).get('server');
const serverUrl=configuredServer||((location.protocol==='http:'||location.protocol==='https:')&&!location.hostname.endsWith('github.io')?`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws`:null);
const chat=document.getElementById('chat-window'),input=document.getElementById('message-input'),form=document.getElementById('message-form'),sendButton=document.getElementById('send-button'),status=document.getElementById('status'),error=document.getElementById('error'),imageInput=document.getElementById('image-input'),preview=document.getElementById('preview'),picker=document.getElementById('emoji-picker'),emojiButton=document.getElementById('emoji-button');
let socket,username,selectedImage=null,retries=0;
const emoji='😀 😃 😄 😁 😆 😅 😂 🙂 🙃 😉 😊 😍 🥰 😘 😎 🤩 🥳 😇 😋 😜 🤔 🤗 😐 🙄 😢 😭 😡 😱 👍 👎 👏 🙌 👋 🤝 🙏 💪 ❤️ 🧡 💛 💚 💙 💜 💯 🔥 ✨ 🎉 🎊 🌈 🌍 🌸 🍕 ☕ 🎮 🚀'.split(' ');
for(const symbol of emoji){const button=document.createElement('button');button.type='button';button.textContent=symbol;button.setAttribute('aria-label',`Insert ${symbol}`);button.addEventListener('click',()=>{input.value+=symbol;input.focus();picker.classList.remove('open');emojiButton.setAttribute('aria-expanded','false')});picker.append(button)}
emojiButton.addEventListener('click',()=>{const open=picker.classList.toggle('open');emojiButton.setAttribute('aria-expanded',String(open))});
function notice(message){error.textContent=message}
function addMessage(message,system=false){const row=document.createElement('div');row.className=`message${system?' system':message.user===username?' mine':''}`;if(!system){const meta=document.createElement('div'),author=document.createElement('span'),time=document.createElement('time');meta.className='meta';author.className='username';author.textContent=message.user;time.textContent=new Date(message.timestamp*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});meta.append(author,time);row.append(meta)}if(message.text){const body=document.createElement('div');body.textContent=message.text;row.append(body)}if(message.image&&/^data:image\/(png|jpeg|gif|webp);base64,/.test(message.image)){const link=document.createElement('a'),img=document.createElement('img');link.href=message.image;link.target='_blank';link.rel='noopener noreferrer';img.src=message.image;img.alt=`Image shared by ${message.user}`;link.append(img);row.append(link)}chat.append(row);chat.scrollTop=chat.scrollHeight}
function setConnected(connected){status.textContent=connected?'● Connected':'● Disconnected';status.classList.toggle('connected',connected);input.disabled=!connected;sendButton.disabled=!connected}
function connect(){if(!serverUrl){status.textContent='Server needed';notice('Add ?server=wss://your-chat-server.example to this page URL.');return}try{socket=new WebSocket(serverUrl)}catch{notice('Invalid server URL.');return}status.textContent='Connecting…';socket.onopen=()=>{retries=0;setConnected(true);notice('');addMessage({text:`Connected as ${username}.`},true);input.focus()};socket.onmessage=event=>{try{const m=JSON.parse(event.data);if(typeof m.user==='string'&&(typeof m.text==='string'||typeof m.image==='string')&&Number.isFinite(m.timestamp))addMessage(m)}catch{}};socket.onclose=()=>{setConnected(false);if(retries<8){const delay=Math.min(1000*2**retries++,15000);setTimeout(connect,delay)}else notice('Unable to reconnect. Refresh to try again.')};socket.onerror=()=>notice('Connection error. Check the chat server address.')}
imageInput.addEventListener('change',()=>{const file=imageInput.files[0];if(!file)return;if(!['image/png','image/jpeg','image/gif','image/webp'].includes(file.type)||file.size>700000){notice('Choose a PNG, JPEG, GIF, or WebP under 700 KB.');imageInput.value='';return}const reader=new FileReader();reader.onload=()=>{selectedImage=reader.result;document.getElementById('preview-image').src=selectedImage;document.getElementById('preview-name').textContent=file.name;preview.classList.add('visible');notice('')};reader.readAsDataURL(file)});
document.getElementById('remove-image').addEventListener('click',()=>{selectedImage=null;imageInput.value='';preview.classList.remove('visible')});
form.addEventListener('submit',event=>{event.preventDefault();const text=input.value.trim();if(!text&&!selectedImage)return;if(!socket||socket.readyState!==WebSocket.OPEN){notice('Wait for the connection before sending.');return}socket.send(JSON.stringify({user:username,text,image:selectedImage}));input.value='';selectedImage=null;imageInput.value='';preview.classList.remove('visible');notice('')});
username=(sessionStorage.getItem('globalChatName')||'').trim();while(username.length<3||username.length>30){const answer=prompt('Choose a player name (3–30 characters):');if(answer===null)break;username=answer.trim()}if(username.length>=3&&username.length<=30){sessionStorage.setItem('globalChatName',username);connect()}else{status.textContent='Name needed';notice('Refresh and enter a player name to join.')}
</script></body></html>
